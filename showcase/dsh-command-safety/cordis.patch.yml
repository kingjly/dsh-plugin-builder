- insert:
    - id: showcase-command-safety
      name: dsh-command-safety
      config:
        protectedTools:
          - bash
          - pwsh
        blockedPatterns:
          - '\brm\s+-(?=[^\s]*r)(?=[^\s]*f)[^\s]+\s+(?:/|~|\$HOME)(?:\s|$)'
          - '\bRemove-Item\b(?=[^\r\n]*\b-Recurse\b)(?=[^\r\n]*\b-Force\b)'
        reason: 'Blocked by the command-safety policy.'
